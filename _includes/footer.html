<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <div class="custom-footer">
      {%- if site.description -%}
        <p class="footer-tagline">{{ site.description | escape }}</p>
      {%- endif -%}

      <div class="social-icons">
        {%- if site.instagram_username -%}
          <a href="https://instagram.com/{{ site.instagram_username| cgi_escape | escape }}" title="Instagram">
            <svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#instagram' | relative_url }}"></use></svg>
          </a>
        {%- endif -%}

        {%- if site.github_username -%}
          <a href="https://www.github.com/{{ site.github_username| cgi_escape | escape }}" title="GitHub">
            <svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use></svg>
          </a>
        {%- endif -%}
       
        {%- if site.linkedin_username -%}
          <a href="https://www.linkedin.com/in/{{ site.linkedin_username| cgi_escape | escape }}" title="LinkedIn">
             <svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#linkedin' | relative_url }}"></use></svg>
          </a>
        {%- endif -%}
      </div>
    </div>
  </div>
</footer>
